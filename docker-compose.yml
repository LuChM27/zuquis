# Entorno de desarrollo: docker compose up
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zuquis}
      POSTGRES_USER: ${POSTGRES_USER:-zuquis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zuquis}
    ports:
      - "5433:5432"  # 5433 en el equipo para no chocar con un PostgreSQL local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/crear-db-pruebas.sql:/docker-entrypoint-initdb.d/10-pruebas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://zuquis:zuquis@db:5432/zuquis}
      JWT_SECRET: ${JWT_SECRET:-solo-para-desarrollo-no-usar-en-produccion}
      ARCHIVOS_DIR: /data/archivos
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - archivos:/data/archivos
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /web
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - api

volumes:
  pgdata:
  archivos:
  web_node_modules:
