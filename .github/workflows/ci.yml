name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zuquis_test
          POSTGRES_USER: zuquis
          POSTGRES_PASSWORD: zuquis
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zuquis -d zuquis_test"
          --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://zuquis:zuquis@127.0.0.1:5433/zuquis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Pruebas (incluye la guardia anti-Float)
        run: pytest
      - name: Imagen Docker de la API
        run: docker build -t zuquis-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zuquis
          POSTGRES_USER: zuquis
          POSTGRES_PASSWORD: zuquis
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zuquis -d zuquis"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://zuquis:zuquis@127.0.0.1:5432/zuquis
      JWT_SECRET: clave-de-ci-solo-para-pruebas-de-extremo-a-extremo
      COOKIE_SECURE: "false"
      ARCHIVOS_DIR: /tmp/archivos
      E2E_ADMIN_EMAIL: admin@zuquis.local
      E2E_ADMIN_CLAVE: zuquis-ci-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: API
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          python -m app.cli crear-admin --email "$E2E_ADMIN_EMAIL" --nombre Administrador --clave "$E2E_ADMIN_CLAVE"
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/salud && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            /tmp/api.log
